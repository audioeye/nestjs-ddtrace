# Supplies the approval that branch protection asks for on Renovate's minor and
# patch updates, so they merge without a person. The org preset in
# audioeye/github-actions decides which PRs carry the `automerge` label; digest
# repoints and majors carry `needs-review` and still wait for a person.
name: Renovate auto-approve and auto-merge
on:
  pull_request:
    # Renovate opens the PR first and adds labels in a second request, so the
    # `opened` event arrives without the label; `labeled` is what triggers the approval.
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  renovate:
    uses: audioeye/github-actions/.github/workflows/renovate-autoapprove-and-automerge.yml@main
