# Warns on pull requests with no activity for 30 days and closes them 60 days
# later. The `keep-open` label exempts a pull request. The policy and every
# setting live in audioeye/github-actions (.github/workflows/stale-prs.yml);
# Renovate keeps the pin below current.
name: Stale PRs
on:
  schedule:
    - cron: "17 13 * * 1-5" # weekdays, 05:17 PST
  workflow_dispatch:
permissions: {}
jobs:
  stale:
    uses: audioeye/github-actions/.github/workflows/stale-prs.yml@426ca7f366908a464667557f1394ab2486ce8eb0 # main
    secrets: inherit # passes RELEASE_BOT_PRIVATE_KEY to the reusable workflow
